<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CivicLink | Register</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="page">

        <div class="register-card">


            <!-- LOGO -->

            <div class="logo-section">

                <div class="logo">
                    🏙️
                </div>

                <h1>
                    CivicLink
                </h1>

                <p>
                    Connect. Report. Improve your community.
                </p>

            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">


                <h2>
                    Create Account
                </h2>

                <p class="form-description">
                    Register as a citizen to report and track civic issues.
                </p>


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        Full Name <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- PHONE -->

                <div class="form-group">

                    <label for="phone">
                        Phone Number <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter 10-digit phone number"
                        maxlength="10"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password <span>*</span>
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            👁
                        </button>

                    </div>

                    <small>
                        Password must contain at least 6 characters.
                    </small>

                </div>


                <!-- GENDER -->

                <div class="form-group">

                    <label for="gender">
                        Gender <span>*</span>
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >

                        <option value="">
                            Select Gender
                        </option>

                        <option value="female">
                            Female
                        </option>

                        <option value="male">
                            Male
                        </option>

                        <option value="other">
                            Other
                        </option>

                        <option value="prefer-not-to-say">
                            Prefer not to say
                        </option>

                    </select>

                </div>


                <!-- PROFESSION -->

                <div class="form-group">

                    <label for="profession">
                        Profession
                    </label>

                    <input
                        type="text"
                        id="profession"
                        name="profession"
                        placeholder="Student, Engineer, Teacher, etc."
                    >

                </div>


                <!-- ADDRESS -->

                <div class="form-group">

                    <label for="address">
                        Address <span>*</span>
                    </label>

                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        required
                    ></textarea>

                </div>


                <!-- TERMS -->

                <div class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <label for="terms">
                        I agree to the CivicLink terms and conditions.
                    </label>

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="register-button"
                    id="registerButton"
                >
                    Create Account
                </button>


                <!-- MESSAGE -->

                <div
                    id="message"
                    class="message"
                ></div>


            </form>


            <!-- LOGIN LINK -->

            <div class="login-section">

                <p>

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>

            </div>


        </div>

    </div>


    <!-- IMPORTANT: JavaScript is loaded separately -->

    <script src="js/register.js"></script>

</body>

</html>
