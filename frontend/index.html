<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicLink - Community Issue Tracker</title>
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <header class="navbar">
        <div class="nav-content">
            <h1>🏛️ CivicLink</h1>
            <p>Report local issues and improve our community together</p>
        </div>
    </header>

    <main class="container">
        <!-- Form to Submit an Issue -->
        <section class="box form-box">
            <h2>Report a Civic Problem</h2>
            <form id="reportForm">
                <div class="form-group">
                    <label for="title">Issue Title *</label>
                    <input type="text" id="title" placeholder="e.g., Streetlight damaged on 4th cross" required />
                </div>

                <div class="form-group">
                    <label for="category">Category *</label>
                    <select id="category" required>
                        <option value="Roads & Potholes">Roads & Potholes</option>
                        <option value="Street Lighting">Street Lighting</option>
                        <option value="Garbage & Sanitation">Garbage & Sanitation</option>
                        <option value="Water Supply & Drainage">Water Supply & Drainage</option>
                        <option value="Public Safety">Public Safety</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="location">Location / Landmark *</label>
                    <input type="text" id="location" placeholder="e.g., Near City Hospital gate" required />
                </div>

                <div class="form-group">
                    <label for="description">Detailed Description *</label>
                    <textarea id="description" rows="4" placeholder="Describe the issue in detail..."
                        required></textarea>
                </div>

                <button type="submit" id="submitBtn">Submit Report</button>
            </form>
        </section>

        <!-- Community Feed -->
        <section class="box feed-box">
            <h2>Recent Reports</h2>
            <div id="loading">Connecting to database...</div>
            <div id="reportsList" class="reports-container"></div>
        </section>
    </main>

    <!-- Connect Scripts -->
    <script src="./js/supabaseClient.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
